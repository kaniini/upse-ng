# SPDX-License-Identifier: LGPL-2.1-or-later
[package]
name = "upse-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "LGPL-2.1-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
upse-psf = { path = "../crates/formats/shared/psf" }
upse-psf2-vfs = { path = "../crates/formats/ps2/vfs" }

[[bin]]
name = "psf_container"
path = "fuzz_targets/psf_container.rs"
test = false
doc = false
bench = false

[[bin]]
name = "psf2_vfs"
path = "fuzz_targets/psf2_vfs.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
