# SPDX-License-Identifier: LGPL-2.1-or-later
[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/support/clock",
    "crates/support/scheduler",
    "crates/support/audio-types",
    "crates/support/audio",
    "crates/formats/shared/psf",
    "crates/formats/ps1/psx-exe",
    "crates/hw/shared/r3000",
    "crates/hw/shared/spu-common",
    "crates/hw/ps1/memory",
    "crates/hw/ps1/cdrom",
    "crates/hw/ps1/gpu",
    "crates/hw/ps1/irq",
    "crates/hw/ps1/timers",
    "crates/hw/ps1/dma",
    "crates/hw/ps1/spu",
    "crates/hle/ps1/bios",
    "crates/machine/ps1",
    "crates/api/upse",
    "crates/api/ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-2.1-or-later"

[workspace.dependencies]
crc32fast = "1.4.2"
flate2 = { version = "1.0.35", default-features = false, features = ["rust_backend"] }
thiserror = "2.0.11"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
